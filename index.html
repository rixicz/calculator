<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Javascript Calculator</h1>
    <h3>I'm happy to show you my JS Calculator that I built as a part of The Odin Project!</h3>
    <h3>This calculator is rather simple, for now you can perform the 4 very basic operations.</h3>
    <h3>Watch out the display has a limit of 13 digits!</h3> 
    <div class="container">
        <div class="display">0</div>
        <div class="buttons">
            <button class="numbers" id="7">7</button>
            <button class="numbers" id="8">8</button>
            <button class="numbers" id="9">9</button>
            <button class="operators" id="slash">/</button>
            <button class="numbers" id="4">4</button>
            <button class="numbers" id="5">5</button>
            <button class="numbers" id="6">6</button>
            <button class="operators" id="star">*</button>
            <button class="numbers" id="1">1</button>
            <button class="numbers" id="2">2</button>
            <button class="numbers" id="3">3</button>
            <button class="operators" id="minus">-</button>
            <button class="numbers" id="0">0</button>
            <button class="operators" id="c">C</button>
            <button id="equalto">=</button>
            <button class="operators" id="plus">+</button>
        </div>
    </div>
</body>
</html>
